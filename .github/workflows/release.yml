name: Tagged release verification

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify immutable version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      BUILDX_VERSION: 0.35.0
      BUILDKIT_VERSION: 0.31.2
      BUILDKIT_IMAGE: moby/buildkit:v0.31.2@sha256:63db51c9b30208a7c2b1c40392c7ebb9ce2f85ba238a18a85420f8f5ea2d4684
    steps:
      - name: Check out the complete tagged history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CPython 3.12.13
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12.13"
          check-latest: false
          architecture: x64

      - name: Set up pinned Buildx and BuildKit
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v${{ env.BUILDX_VERSION }}
          driver: docker-container
          use: true
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Reject mutable or inconsistent release identity
        run: |
          python scripts/check_version_contract.py --release
          python scripts/check_git_history.py

      - name: Install exact release and test wheel artifacts
        run: >-
          python -m pip install --no-cache-dir --no-deps --only-binary=:all:
          --require-hashes --requirement requirements-ci-linux-x86_64.lock

      - name: Verify runtime and base-image identities
        run: |
          python scripts/check_base_image_identity.py
          python scripts/check_runtime_environment.py
          python -m pip check

      - name: Reproduce tests and canonical outputs
        run: |
          python -m pytest -p no:cacheprovider
          python scripts/build_v1_golden_fixtures.py --check
          python scripts/check_public_release.py

      - name: Build and smoke-test the immutable application image
        run: |
          set -euo pipefail
          ldfreq_source_date_epoch="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH="${ldfreq_source_date_epoch}"
          ldfreq_buildx_version="$(docker buildx version | awk '{print $2}' | sed 's/^v//')"
          ldfreq_builder_inspect="$(docker buildx inspect --bootstrap)"
          ldfreq_buildkit_version="$(awk '/^BuildKit( version)?:/ {value=$NF; sub(/^v/, "", value); print value; exit}' <<< "${ldfreq_builder_inspect}")"
          test "${ldfreq_buildx_version}" = "${BUILDX_VERSION}"
          test "${ldfreq_buildkit_version}" = "${BUILDKIT_VERSION}"
          docker buildx build --no-cache --target production --platform linux/amd64 \
            --file deploy/cloud-run/Dockerfile \
            --provenance=false \
            --build-arg "SOURCE_DATE_EPOCH=${ldfreq_source_date_epoch}" \
            --metadata-file /tmp/ldfreq-release-build.json \
            --output "type=oci,dest=/tmp/ldfreq-release.oci.tar,rewrite-timestamp=true,compatibility-version=20" .
          python scripts/build_oci_image_evidence.py \
            --archive /tmp/ldfreq-release.oci.tar \
            --metadata /tmp/ldfreq-release-build.json \
            --source-date-epoch "${ldfreq_source_date_epoch}" \
            --output /tmp/ldfreq-release-oci-evidence.json
          ldfreq_image_config_digest="$(jq -er '.image.config_digest' /tmp/ldfreq-release-oci-evidence.json)"
          ldfreq_image_manifest_digest="$(jq -er '.image.manifest_digest' /tmp/ldfreq-release-oci-evidence.json)"
          docker buildx build --target production --platform linux/amd64 \
            --file deploy/cloud-run/Dockerfile \
            --provenance=false \
            --build-arg "SOURCE_DATE_EPOCH=${ldfreq_source_date_epoch}" \
            --load --tag "ldfreq:${GITHUB_SHA}" .
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp/ldfreq:rw,noexec,nosuid,nodev,size=67108864,uid=10001,gid=10001,mode=0700 \
            "ldfreq:${GITHUB_SHA}" \
            python -c 'import ldfreq; print(ldfreq.__version__, ldfreq.OUTPUT_SCHEMA_VERSION)'
          python scripts/build_release_archive.py \
            --output /tmp/ldfreq-source.tar.gz
          python scripts/build_release_evidence.py \
            --image-config-digest "${ldfreq_image_config_digest}" \
            --image-manifest-digest "${ldfreq_image_manifest_digest}" \
            --oci-image-evidence /tmp/ldfreq-release-oci-evidence.json \
            --source-archive /tmp/ldfreq-source.tar.gz \
            --output /tmp/ldfreq-release-evidence.json
          sha256sum /tmp/ldfreq-release.oci.tar
          sha256sum /tmp/ldfreq-source.tar.gz
          sha256sum /tmp/ldfreq-release-evidence.json

      - name: Prove verification did not mutate the tagged tree
        run: |
          git diff --check
          git diff --exit-code
          git diff --cached --check
          git diff --cached --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
